name: CI/CD Pipeline - Build, Test & Deploy to Azure

on:
  push:
    branches:
      - main

env:
  REGISTRY: laurenastudio.azurecr.io
  API_IMAGE: laurena-api
  FRONTEND_IMAGE: laurena-frontend
  WEBAPP_NAME: studiolaurena
  RESOURCE_GROUP: studio

jobs:
  # ─────────────────────────────────────────
  # JOB 1: Build & Test both Docker images
  # ─────────────────────────────────────────
  build-and-test:
    name: "Build & Test Docker Images"
    runs-on: ubuntu-latest

    outputs:
      image-tag: ${{ steps.meta.outputs.tag }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate image tag from commit SHA
        id: meta
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          echo "tag=$SHORT_SHA" >> "$GITHUB_OUTPUT"
          echo "Image tag: $SHORT_SHA"

      # ── Build both images ──────────────────────────────────────────────────

      - name: Build API image
        run: |
          docker build \
            --tag ${{ env.API_IMAGE }}:${{ steps.meta.outputs.tag }} \
            --tag ${{ env.API_IMAGE }}:latest \
            --file backend/Dockerfile \
            .

      - name: Build Frontend image
        run: |
          docker build \
            --tag ${{ env.FRONTEND_IMAGE }}:${{ steps.meta.outputs.tag }} \
            --tag ${{ env.FRONTEND_IMAGE }}:latest \
            --file Dockerfile.frontend.prod \
            .

      # ── Start containers for health check ──────────────────────────────────
      # API: skip alembic migrations (no DB in CI), just verify the app starts
      # Frontend: nginx serves static files, no dependencies

      - name: Start API container for test
        run: |
          docker run \
            --detach \
            --name test-api \
            --publish 8000:8000 \
            ${{ env.API_IMAGE }}:${{ steps.meta.outputs.tag }} \
            sh -c "uvicorn app.main:app --host 0.0.0.0 --port 8000"

      - name: Start Frontend container for test
        run: |
          docker run \
            --detach \
            --name test-frontend \
            --publish 8080:8080 \
            ${{ env.FRONTEND_IMAGE }}:${{ steps.meta.outputs.tag }}

      # ── Health checks ──────────────────────────────────────────────────────

      - name: Health Check - API (/health)
        run: |
          MAX_RETRIES=10
          RETRY_INTERVAL=5
          SUCCESS=false

          for i in $(seq 1 $MAX_RETRIES); do
            echo "Attempt $i/$MAX_RETRIES..."
            HTTP_STATUS=$(curl --silent --output /dev/null --write-out "%{http_code}" \
              --max-time 10 \
              http://localhost:8000/health || echo "000")

            echo "HTTP Status: $HTTP_STATUS"

            if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 400 ]; then
              echo "API health check passed! Status: $HTTP_STATUS"
              SUCCESS=true
              break
            fi

            echo "API not ready yet. Waiting ${RETRY_INTERVAL}s..."
            sleep $RETRY_INTERVAL
          done

          if [ "$SUCCESS" = false ]; then
            echo "API health check FAILED after $MAX_RETRIES attempts."
            echo "=== Container logs ==="
            docker logs test-api
            exit 1
          fi

      - name: Health Check - Frontend (/)
        run: |
          MAX_RETRIES=5
          RETRY_INTERVAL=3
          SUCCESS=false

          for i in $(seq 1 $MAX_RETRIES); do
            echo "Attempt $i/$MAX_RETRIES..."
            HTTP_STATUS=$(curl --silent --output /dev/null --write-out "%{http_code}" \
              --max-time 10 \
              http://localhost:8080/ || echo "000")

            echo "HTTP Status: $HTTP_STATUS"

            if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 400 ]; then
              echo "Frontend health check passed! Status: $HTTP_STATUS"
              SUCCESS=true
              break
            fi

            echo "Frontend not ready yet. Waiting ${RETRY_INTERVAL}s..."
            sleep $RETRY_INTERVAL
          done

          if [ "$SUCCESS" = false ]; then
            echo "Frontend health check FAILED after $MAX_RETRIES attempts."
            echo "=== Container logs ==="
            docker logs test-frontend
            exit 1
          fi

      - name: Collect container logs
        if: success()
        run: |
          echo "=== API Logs ==="
          docker logs test-api
          echo ""
          echo "=== Frontend Logs ==="
          docker logs test-frontend

      - name: Stop and remove test containers
        if: always()
        run: |
          docker stop test-api test-frontend || true
          docker rm test-api test-frontend || true

      # ── Save images as artifacts for deploy job ────────────────────────────

      - name: Save API image
        if: success()
        run: |
          docker save ${{ env.API_IMAGE }}:${{ steps.meta.outputs.tag }} \
            | gzip > /tmp/api-image.tar.gz

      - name: Save Frontend image
        if: success()
        run: |
          docker save ${{ env.FRONTEND_IMAGE }}:${{ steps.meta.outputs.tag }} \
            | gzip > /tmp/frontend-image.tar.gz

      - name: Upload API image artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: api-image
          path: /tmp/api-image.tar.gz
          retention-days: 1

      - name: Upload Frontend image artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-image
          path: /tmp/frontend-image.tar.gz
          retention-days: 1

  # ─────────────────────────────────────────
  # JOB 2: Push to ACR & Deploy (contrôle total)
  # Pas de webhook — le workflow contrôle tout:
  #   1. Push images vers ACR
  #   2. Restart explicite via SCM API
  #   3. Vérification que l'app répond
  # ─────────────────────────────────────────
  deploy:
    name: "Push to ACR & Deploy"
    runs-on: ubuntu-latest
    needs: build-and-test
    environment: production

    env:
      SCM_HOST: studiolaurena-g8eadbcrg8a9hyeq.scm.canadacentral-01.azurewebsites.net
      APP_HOST: studiolaurena-g8eadbcrg8a9hyeq.canadacentral-01.azurewebsites.net

    steps:
      - name: Download image artifacts
        uses: actions/download-artifact@v4
        with:
          path: /tmp/images

      - name: Load Docker images
        run: |
          gunzip -c /tmp/images/api-image/api-image.tar.gz | docker load
          gunzip -c /tmp/images/frontend-image/frontend-image.tar.gz | docker load
          echo "Both images loaded successfully."

      # ── Push to ACR ────────────────────────────────────────────────────────

      - name: Login to ACR
        run: |
          echo "${{ secrets.ACR_PASSWORD }}" | docker login \
            ${{ env.REGISTRY }} \
            --username "${{ secrets.ACR_USERNAME }}" \
            --password-stdin

      - name: Tag and push images to ACR
        run: |
          TAG=${{ needs.build-and-test.outputs.image-tag }}

          # Tag API
          docker tag ${{ env.API_IMAGE }}:$TAG \
            ${{ env.REGISTRY }}/${{ env.API_IMAGE }}:$TAG
          docker tag ${{ env.API_IMAGE }}:$TAG \
            ${{ env.REGISTRY }}/${{ env.API_IMAGE }}:latest

          # Tag Frontend
          docker tag ${{ env.FRONTEND_IMAGE }}:$TAG \
            ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE }}:$TAG
          docker tag ${{ env.FRONTEND_IMAGE }}:$TAG \
            ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE }}:latest

          # Push SHA tags first, then :latest
          docker push ${{ env.REGISTRY }}/${{ env.API_IMAGE }}:$TAG
          docker push ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE }}:$TAG
          docker push ${{ env.REGISTRY }}/${{ env.API_IMAGE }}:latest
          docker push ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE }}:latest

          echo "All images pushed to ACR."

      # ── Deploy explicite — restart via SCM API ─────────────────────────────
      # Sitecontainers pointent vers :latest + SystemIdentity
      # Le restart force Azure à pull les nouvelles images :latest depuis ACR

      - name: Restart App Service via SCM API
        env:
          SCM_USER: ${{ secrets.WEBAPP_DEPLOY_USER }}
          SCM_PASS: ${{ secrets.WEBAPP_DEPLOY_PASSWORD }}
        run: |
          echo "Triggering explicit container restart via SCM docker/hook..."

          HTTP_CODE=$(curl --silent --output /dev/null --write-out "%{http_code}" \
            --max-time 60 \
            -X POST \
            -H "Content-Type: application/json" \
            -d '{"action":"push"}' \
            -u "${SCM_USER}:${SCM_PASS}" \
            "https://${{ env.SCM_HOST }}/docker/hook")

          echo "SCM docker/hook response: $HTTP_CODE"

          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            echo "ERROR: Could not trigger container restart (HTTP $HTTP_CODE)."
            exit 1
          fi

          echo "Container restart triggered successfully (HTTP $HTTP_CODE)."

      # ── Vérification du déploiement ────────────────────────────────────────

      - name: Wait for containers to stabilize
        run: |
          echo "Waiting 45s for containers to pull new images and start..."
          sleep 45

      - name: Verify frontend is responding
        run: |
          MAX_RETRIES=8
          RETRY_INTERVAL=15
          SUCCESS=false

          for i in $(seq 1 $MAX_RETRIES); do
            echo "Verification $i/$MAX_RETRIES..."
            HTTP_STATUS=$(curl --silent --output /dev/null --write-out "%{http_code}" \
              --max-time 20 \
              "https://${{ env.APP_HOST }}/" || echo "000")

            echo "Frontend: $HTTP_STATUS"

            if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 400 ]; then
              echo "Frontend is responding."
              SUCCESS=true
              break
            fi

            sleep $RETRY_INTERVAL
          done

          if [ "$SUCCESS" = false ]; then
            echo "ERROR: Frontend not responding after $MAX_RETRIES attempts."
            exit 1
          fi

      - name: Verify API is responding
        run: |
          MAX_RETRIES=6
          RETRY_INTERVAL=10
          SUCCESS=false

          for i in $(seq 1 $MAX_RETRIES); do
            echo "API check $i/$MAX_RETRIES..."
            RESPONSE=$(curl --silent --max-time 15 \
              "https://${{ env.APP_HOST }}/health" || echo "FAIL")

            echo "API response: $RESPONSE"

            if echo "$RESPONSE" | grep -q '"status"'; then
              echo "API health check passed."
              SUCCESS=true
              break
            fi

            sleep $RETRY_INTERVAL
          done

          if [ "$SUCCESS" = false ]; then
            echo "WARNING: API not responding yet. May still be starting."
            echo "Check Azure Portal > studiolaurena > Sitecontainers for details."
          fi

      - name: Deployment summary
        if: always()
        run: |
          TAG=${{ needs.build-and-test.outputs.image-tag }}
          echo "═══════════════════════════════════════════"
          echo "  DEPLOYMENT SUMMARY"
          echo "═══════════════════════════════════════════"
          echo "  Commit:    $TAG"
          echo "  API:       ${{ env.REGISTRY }}/${{ env.API_IMAGE }}:$TAG"
          echo "  Frontend:  ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE }}:$TAG"
          echo "  App URL:   https://${{ env.APP_HOST }}"
          echo "═══════════════════════════════════════════"
