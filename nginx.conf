upstream api_backend {
    server api:8000;
    keepalive 32;
}

# Resolver : Docker Compose internal DNS (127.0.0.11:53)
# This makes nginx resolve "api:8000" at runtime, not at startup
resolver 127.0.0.11 valid=10s;
resolver_timeout 5s;

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;

    # ── Timeouts & retry logic ────────────────────────────────────────
    # On Azure cold start, api may take 2-5min for migrations
    proxy_connect_timeout 10s;
    proxy_send_timeout 30s;
    proxy_read_timeout 60s;
    proxy_next_upstream error timeout http_502 http_503 http_504;
    proxy_next_upstream_tries 30;
    proxy_next_upstream_timeout 300s;

    location /api/ {
        proxy_pass http://api_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    location /uploads/ {
        proxy_pass http://api_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    location /health {
        proxy_pass http://api_backend;
        access_log off;
    }

    location /docs {
        proxy_pass http://api_backend;
    }
    location /redoc {
        proxy_pass http://api_backend;
    }
    location /openapi.json {
        proxy_pass http://api_backend;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
