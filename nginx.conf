server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Docker embedded DNS — resolve "api" at request time, not at nginx startup.
    # Without this, nginx fails with "host not found in upstream api" when the api
    # host is not yet in DNS (CI runs containers separately) or starts after nginx.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;
    set $api_upstream http://api:8000;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;

    # Proxy API to the api container on the Docker network (Azure multi-container)
    location /api/ {
        proxy_pass $api_upstream$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_connect_timeout 600s;
        proxy_send_timeout 600s;
    }

    # Uploaded/generated files
    location /uploads/ {
        proxy_pass $api_upstream$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /health {
        proxy_pass $api_upstream$request_uri;
    }

    location /docs {
        proxy_pass $api_upstream$request_uri;
    }
    location /redoc {
        proxy_pass $api_upstream$request_uri;
    }
    location /openapi.json {
        proxy_pass $api_upstream$request_uri;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
