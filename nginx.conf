server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Docker embedded DNS — resolve api at request time so nginx can start before api is up.
    # (Static proxy_pass http://api:8000 resolves at config load and can prevent nginx from starting.)
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend_api http://api:8000;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;

    location /api/ {
        proxy_pass $backend_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_connect_timeout 600s;
        proxy_send_timeout 600s;
    }

    location /uploads/ {
        proxy_pass $backend_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /health {
        proxy_pass $backend_api;
    }

    location /docs {
        proxy_pass $backend_api;
    }
    location /redoc {
        proxy_pass $backend_api;
    }
    location /openapi.json {
        proxy_pass $backend_api;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
