# Copiez ce fichier vers : .github/workflows/deploy.yml
# sur un dépôt site-* existant si l’ancien workflow appelle encore « gcloud services enable ».
# Remplacez REGION_PLACEHOLDER par votre région (ex. us-central1) — doit correspondre à GCP_REGION dans .env.

name: Deploy static site to Cloud Run

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.repository }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy to Cloud Run
        env:
          CLOUDSDK_CORE_DISABLE_PROMPTS: "1"
        run: |
          set -e
          gcloud run deploy "${{ github.event.repository.name }}" \
            --project "${{ secrets.GCP_PROJECT_ID }}" \
            --source . \
            --region "REGION_PLACEHOLDER" \
            --allow-unauthenticated \
            --quiet
