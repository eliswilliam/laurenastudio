services:
  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: example
      POSTGRES_DB: laurenadb
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── FastAPI Backend ─────────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:example@db:5432/laurenadb
      BACKEND_URL: http://localhost:8000
      FRONTEND_URL: http://localhost:8080
      GOOGLE_APPLICATION_CREDENTIALS: /root/.config/gcloud/application_default_credentials.json
    volumes:
      - ./backend:/app
      - ${APPDATA}/gcloud/application_default_credentials.json:/root/.config/gcloud/application_default_credentials.json:ro
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    depends_on:
      db:
        condition: service_healthy

  # ── Frontend (Vite / React) ─────────────────────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    restart: always
    ports:
      - "8080:8080"
    volumes:
      - ./src:/app/src
      - ./public:/app/public
      - ./index.html:/app/index.html
    environment:
      VITE_BACKEND_TARGET: http://api:8000
      VITE_CODE_SERVER_TARGET: http://code-server:8443
    depends_on:
      - api

  # ── LAURENA CODE — code-server (VS Code Web) ──────────────────────────────
  code-server:
    image: codercom/code-server:latest
    restart: always
    ports:
      - "8443:8443"
    environment:
      DOCKER_USER: coder
    volumes:
      - ./backend/workspaces:/home/coder/workspaces
      - ./backend/code-server/config.yaml:/home/coder/.config/code-server/config.yaml
      - code_server_data:/home/coder/.local/share/code-server
    command: >
      code-server
        --bind-addr 0.0.0.0:8443
        --auth none
        --disable-telemetry
        --disable-update-check
        --app-name "LAURENA CODE"
        /home/coder/workspaces

volumes:
  db_data:
  code_server_data:
