name: CI/CD Pipeline - Build, Test & Deploy to Azure

on:
  push:
    branches:
      - main

env:
  REGISTRY: laurenastudio.azurecr.io
  COMBINED_IMAGE: laurena-app
  WEBAPP_NAME: studiolaurena
  RESOURCE_GROUP: studio
jobs:
  # ─────────────────────────────────────────
  # JOB 1: Build & Test combined Docker image
  # ─────────────────────────────────────────
  build-and-test:
    name: "Build & Test Combined Docker Image"
    runs-on: ubuntu-latest

    outputs:
      image-tag: ${{ steps.meta.outputs.tag }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate image tag from commit SHA
        id: meta
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          echo "tag=$SHORT_SHA" >> "$GITHUB_OUTPUT"
          echo "Image tag: $SHORT_SHA"

      # ── Build combined image (nginx + uvicorn + supervisord) ───────────────

      - name: Build Combined image (nginx + API + frontend)
        env:
          VITE_ROOT_DOMAIN_RESOLVED: ${{ vars.VITE_ROOT_DOMAIN }}
        run: |
          DOMAIN="${VITE_ROOT_DOMAIN_RESOLVED:-laurenastudio.pro}"
          docker build \
            --build-arg "VITE_ROOT_DOMAIN=$DOMAIN" \
            --tag ${{ env.COMBINED_IMAGE }}:${{ steps.meta.outputs.tag }} \
            --tag ${{ env.COMBINED_IMAGE }}:latest \
            --file Dockerfile.combined \
            .

      # ── Start combined container for health check ──────────────────────────

      - name: Start Combined container for test
        run: |
          docker run \
            --detach \
            --name test-app \
            --publish 8080:8080 \
            ${{ env.COMBINED_IMAGE }}:${{ steps.meta.outputs.tag }} \
            sh -c "supervisord -c /etc/supervisor/conf.d/supervisord.conf"

      # ── Health checks ──────────────────────────────────────────────────────

      - name: Health Check - Frontend (/)
        run: |
          MAX_RETRIES=10
          RETRY_INTERVAL=3
          SUCCESS=false

          for i in $(seq 1 $MAX_RETRIES); do
            echo "Attempt $i/$MAX_RETRIES..."
            HTTP_STATUS=$(curl --silent --output /dev/null --write-out "%{http_code}" \
              --max-time 10 \
              http://localhost:8080/ || echo "000")

            echo "Frontend HTTP Status: $HTTP_STATUS"

            if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 400 ]; then
              echo "Frontend health check passed! Status: $HTTP_STATUS"
              SUCCESS=true
              break
            fi

            echo "Frontend not ready yet. Waiting ${RETRY_INTERVAL}s..."
            sleep $RETRY_INTERVAL
          done

          if [ "$SUCCESS" = false ]; then
            echo "Frontend health check FAILED after $MAX_RETRIES attempts."
            echo "=== Container logs ==="
            docker logs test-app
            exit 1
          fi

      - name: Health Check - API (/health)
        run: |
          MAX_RETRIES=10
          RETRY_INTERVAL=5
          SUCCESS=false

          for i in $(seq 1 $MAX_RETRIES); do
            echo "Attempt $i/$MAX_RETRIES..."
            HTTP_STATUS=$(curl --silent --output /dev/null --write-out "%{http_code}" \
              --max-time 10 \
              http://localhost:8080/health || echo "000")

            echo "API HTTP Status: $HTTP_STATUS"

            if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 400 ]; then
              echo "API health check passed! Status: $HTTP_STATUS"
              SUCCESS=true
              break
            fi

            echo "API not ready yet. Waiting ${RETRY_INTERVAL}s..."
            sleep $RETRY_INTERVAL
          done

          if [ "$SUCCESS" = false ]; then
            echo "API health check FAILED after $MAX_RETRIES attempts."
            echo "=== Container logs ==="
            docker logs test-app
            exit 1
          fi

      - name: Collect container logs
        if: success()
        run: |
          echo "=== Combined App Logs ==="
          docker logs test-app

      - name: Stop and remove test container
        if: always()
        run: |
          docker stop test-app || true
          docker rm test-app || true

      # ── Save image as artifact for deploy job ──────────────────────────────

      - name: Save Combined image
        if: success()
        run: |
          docker save ${{ env.COMBINED_IMAGE }}:${{ steps.meta.outputs.tag }} \
            | gzip > /tmp/app-image.tar.gz

      - name: Upload Combined image artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-image
          path: /tmp/app-image.tar.gz
          retention-days: 1

  # ─────────────────────────────────────────
  # JOB 2: Push to ACR & Deploy
  # ─────────────────────────────────────────
  deploy:
    name: "Push to ACR & Deploy"
    runs-on: ubuntu-latest
    needs: build-and-test
    environment: production

    env:
      SCM_HOST: studiolaurena-g8eadbcrg8a9hyeq.scm.canadacentral-01.azurewebsites.net
      APP_HOST: studiolaurena-g8eadbcrg8a9hyeq.canadacentral-01.azurewebsites.net
      AZURE_CREDENTIALS: ${{ secrets.AZURE_CREDENTIALS }}

    steps:
      - name: Download image artifact
        uses: actions/download-artifact@v4
        with:
          path: /tmp/images

      - name: Load Docker image
        run: |
          gunzip -c /tmp/images/app-image/app-image.tar.gz | docker load
          echo "Image loaded successfully."

      # ── Push to ACR ────────────────────────────────────────────────────────

      - name: Login to ACR
        run: |
          echo "${{ secrets.ACR_PASSWORD }}" | docker login \
            ${{ env.REGISTRY }} \
            --username "${{ secrets.ACR_USERNAME }}" \
            --password-stdin

      - name: Tag and push image to ACR
        run: |
          TAG=${{ needs.build-and-test.outputs.image-tag }}

          # Tag Combined image
          docker tag ${{ env.COMBINED_IMAGE }}:$TAG \
            ${{ env.REGISTRY }}/${{ env.COMBINED_IMAGE }}:$TAG
          docker tag ${{ env.COMBINED_IMAGE }}:$TAG \
            ${{ env.REGISTRY }}/${{ env.COMBINED_IMAGE }}:latest

          # Push
          docker push ${{ env.REGISTRY }}/${{ env.COMBINED_IMAGE }}:$TAG
          docker push ${{ env.REGISTRY }}/${{ env.COMBINED_IMAGE }}:latest

          echo "Image pushed to ACR."

      # ── App Service platform settings ──────────────────────────────────────
      - name: Azure login
        if: ${{ env.AZURE_CREDENTIALS != '' }}
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Apply WEBSITES_PORT and WEBSITES_CONTAINER_START_TIME_LIMIT
        if: ${{ env.AZURE_CREDENTIALS != '' }}
        run: |
          az webapp config appsettings set \
            --resource-group "${{ env.RESOURCE_GROUP }}" \
            --name "${{ env.WEBAPP_NAME }}" \
            --settings WEBSITES_PORT=8080 WEBSITES_CONTAINER_START_TIME_LIMIT=600

      # ── Deploy — restart via SCM API ───────────────────────────────────────

      - name: Restart App Service via SCM API
        env:
          SCM_USER: ${{ secrets.WEBAPP_DEPLOY_USER }}
          SCM_PASS: ${{ secrets.WEBAPP_DEPLOY_PASSWORD }}
        run: |
          echo "Triggering container restart via SCM docker/hook..."

          HTTP_CODE=$(curl --silent --output /dev/null --write-out "%{http_code}" \
            --max-time 60 \
            -X POST \
            -H "Content-Type: application/json" \
            -d '{"action":"push"}' \
            -u "${SCM_USER}:${SCM_PASS}" \
            "https://${{ env.SCM_HOST }}/docker/hook")

          echo "SCM docker/hook response: $HTTP_CODE"

          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            echo "ERROR: Could not trigger container restart (HTTP $HTTP_CODE)."
            exit 1
          fi

          echo "Container restart triggered successfully (HTTP $HTTP_CODE)."

      # ── Vérification du déploiement ────────────────────────────────────────

      - name: Wait for container to stabilize
        run: |
          echo "Waiting 120s for ACR pull, alembic, and supervisord startup..."
          sleep 120

      - name: Verify frontend is responding
        run: |
          MAX_RETRIES=20
          RETRY_INTERVAL=20
          SUCCESS=false

          for i in $(seq 1 $MAX_RETRIES); do
            echo "Verification $i/$MAX_RETRIES..."
            HTTP_STATUS=$(curl -4 --silent --output /dev/null --write-out "%{http_code}" \
              --max-time 45 \
              --retry 2 --retry-delay 3 \
              "https://${{ env.APP_HOST }}/" || echo "000")

            echo "Frontend: $HTTP_STATUS"

            if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 400 ]; then
              echo "Frontend is responding."
              SUCCESS=true
              break
            fi

            sleep $RETRY_INTERVAL
          done

          if [ "$SUCCESS" = false ]; then
            echo "ERROR: Frontend not responding after $MAX_RETRIES attempts."
            exit 1
          fi

      - name: Verify API is responding
        run: |
          MAX_RETRIES=6
          RETRY_INTERVAL=10
          SUCCESS=false

          for i in $(seq 1 $MAX_RETRIES); do
            echo "API check $i/$MAX_RETRIES..."
            HTTP_STATUS=$(curl -4 --silent --output /dev/null --write-out "%{http_code}" \
              --max-time 25 \
              "https://${{ env.APP_HOST }}/health" || echo "000")

            echo "API status: $HTTP_STATUS"

            if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 400 ]; then
              echo "API health check passed."
              SUCCESS=true
              break
            fi

            sleep $RETRY_INTERVAL
          done

          if [ "$SUCCESS" = false ]; then
            echo "WARNING: API not responding yet. May still be starting."
          fi

      - name: Deployment summary
        if: always()
        run: |
          TAG=${{ needs.build-and-test.outputs.image-tag }}
          echo "═══════════════════════════════════════════"
          echo "  DEPLOYMENT SUMMARY"
          echo "═══════════════════════════════════════════"
          echo "  Commit:    $TAG"
          echo "  Image:     ${{ env.REGISTRY }}/${{ env.COMBINED_IMAGE }}:$TAG"
          echo "  App URL:   https://${{ env.APP_HOST }}"
          echo "═══════════════════════════════════════════"
