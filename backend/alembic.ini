# alembic.ini — Alembic configuration for Laurena Studio
[alembic]
# path to migration scripts
script_location = alembic

# template used to generate migration file names
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

# max length of characters to apply to the "slug" field
truncate_slug_length = 40

# timezone to use when rendering the date within the migration file
timezone = UTC

# sys.path path, will be prepended to sys.path if present.
prepend_sys_path = .

# version location specification
version_locations = %(here)s/alembic/versions

# The SQLAlchemy URL is overridden inside env.py from app settings.
# Leave this as a placeholder — do NOT hardcode credentials here.
sqlalchemy.url = driver://user:pass@localhost/dbname

[post_write_hooks]
# No post-write hooks configured

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
