map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Docker DNS resolver (valid at runtime, not startup)

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;

    # ── Timeouts & retry logic ────────────────────────────────────────
    # Long reads: ARQ returns 202 quickly, but other /api calls may stream; Minimax no longer blocks HTTP.
    proxy_connect_timeout 15s;
    proxy_send_timeout 600s;
    proxy_read_timeout 600s;
    proxy_next_upstream error timeout http_502 http_503 http_504;
    proxy_next_upstream_tries 30;
    proxy_next_upstream_timeout 600s;

    # Use a variable to delay DNS resolution  
    set $api_backend "http://127.0.0.1:8000";
    location /api/ {
        proxy_pass $api_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    location /uploads/ {
        proxy_pass $api_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    location /health {
        proxy_pass $api_backend;
        access_log off;
    }

    location /docs {
        proxy_pass $api_backend;
    }
    location /redoc {
        proxy_pass $api_backend;
    }
    location /openapi.json {
        proxy_pass $api_backend;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
